<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosco</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Pantalla de login: se muestra si no hay sesión -->
  <section id="login" class="login">
    <form id="form-login" class="card">
      <h3>Ingresar</h3>
      <input name="email" type="email" placeholder="Email" required autocomplete="username">
      <input name="password" type="password" placeholder="Contraseña" required autocomplete="current-password">
      <button class="btn-primario">Entrar</button>
      <p id="error-login" class="deuda"></p>
    </form>
  </section>

  <!-- App: se muestra al iniciar sesión -->
  <div id="app" hidden>
    <nav class="top-nav">
      <button class="tab activa" data-seccion="ventas">VENTAS</button>
      <button class="tab" data-seccion="cc">CC</button>
      <button class="tab" data-seccion="resumen">RESUMEN</button>
    </nav>

    <main>
      <section id="ventas" class="seccion activa"></section>
      <section id="cc" class="seccion"></section>
      <section id="resumen" class="seccion"></section>
    </main>

    <footer class="pie">
      <button id="btn-salir" class="btn-secundario">Cerrar sesión</button>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
